version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_SERVER=db
      - DB_USERNAME=dairy
      - DB_PASSWORD=dairy123
      - DB_NAME=dry

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dry
      MYSQL_USER: dairy
      MYSQL_PASSWORD: dairy123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/dry.sql:/docker-entrypoint-initdb.d/dry.sql:ro

volumes:
  db_data:
